[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "fitness-form-analysis-ai"
version = "0.1.0"
description = "Realtime exercise form analysis with pose estimation and repetition tracking."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
  { name = "Namael" },
]
dependencies = [
  "dearpygui",
  "mediapipe==0.10.14",
  "numpy",
  "opencv-python",
  "ultralytics",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8.0",
]

[project.scripts]
fitness-form-ai = "fitness_form_ai.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fitness_form_ai"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
